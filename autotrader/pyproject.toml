[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrader"
version = "0.1.0"
description = "A small, dependency-free automatic stock trading platform (backtesting + paper/live trading)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["requests>=2.28"]

[project.scripts]
autotrader = "autotrader.cli:main"

[tool.setuptools]
packages = ["autotrader"]
